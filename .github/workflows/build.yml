name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The release signing key lives in encrypted repository secrets, never in the code.
      # Forks / repos without the secrets skip the build instead of failing.
      - name: Check signing key
        id: key
        env:
          KS: ${{ secrets.DMONLY_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::warning::Signing key secrets are not set up yet, so no APK was built."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.key.outputs.ok == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        if: steps.key.outputs.ok == 'true'
        with:
          gradle-version: '8.10.2'

      - name: Build signed release APK
        if: steps.key.outputs.ok == 'true'
        env:
          DMONLY_KEYSTORE_B64: ${{ secrets.DMONLY_KEYSTORE_B64 }}
          DMONLY_KEYSTORE_PASSWORD: ${{ secrets.DMONLY_KEYSTORE_PASSWORD }}
        run: |
          echo "$DMONLY_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          export DMONLY_KEYSTORE="$RUNNER_TEMP/release.keystore"
          gradle assembleRelease --no-daemon -Pvc=${{ github.run_number }}
          rm -f "$RUNNER_TEMP/release.keystore"
          cp app/build/outputs/apk/release/app-release.apk TheResistance.apk
          cp notifs/build/outputs/apk/release/notifs-release.apk ResistanceNotifications.apk

      - name: Check the APKs (signed, not debuggable)
        if: steps.key.outputs.ok == 'true'
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for APK in TheResistance.apk ResistanceNotifications.apk; do
            "$BT/apksigner" verify --print-certs "$APK"
            if "$BT/aapt" dump xmltree "$APK" AndroidManifest.xml | grep -q "debuggable.*0xffffffff"; then
              echo "::error::$APK is debuggable"; exit 1
            fi
            "$BT/aapt" dump badging "$APK" | head -1
          done

      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.ok == 'true'
        with:
          name: TheResistance-apks
          path: |
            TheResistance.apk
            ResistanceNotifications.apk

      # Every build becomes its own numbered release = public version history.
      # The app's "Check for updates" reads the newest one.
      - name: Publish release
        if: steps.key.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          git log -1 --pretty=%B > notes.txt
          # Add-on first, main app last (older app versions download the last .apk listed).
          gh release create "v${{ github.run_number }}" ResistanceNotifications.apk \
            --title "The Resistance 1.${{ github.run_number }}" \
            --notes-file notes.txt \
            --target "${{ github.sha }}" --draft
          gh release upload "v${{ github.run_number }}" TheResistance.apk
          gh release edit "v${{ github.run_number }}" --draft=false --latest
