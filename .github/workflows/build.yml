      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk DMOnly.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DMOnly-apk
          path: DMOnly.apk

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest DMOnly.apk \
          --title "DM Only (latest build)" \
          --notes "Open this page on your phone and tap DMOnly.apk to install." \
          --target "$(git rev-parse HEAD)"
